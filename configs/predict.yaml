debug: False
outfolder: run_variance_by_dimension_mean_scaled
overwrite: True
nexp: 3
output_to_file: True 

datamodule_type: COORDINATES
datamodule_args:
    datareader_type: XTC
    datareader_args:
        xtcfile: ./data_generation/ala2/solvated/300K/ala2_100ns/md.xtc
        tprfile: ./data_generation/ala2/solvated/300K/initialization/tpr_initial.tpr
        selection: "(resname ALA or resname ACE or resname NME) and not element H"
        parallel: False
    dataset_type : "GRAPH"

propagator_type: TFT
propagator_train_path: ./train_runs/propagator/tft/cg/gaussian_regression/run_2

inference_args:
    plot_decoded: False
    predict_steps: 500000
    noise_type: "variance_by_dimension_mean"
    noise_args:
        scale_factor: 3.4
        mu_data_file: data_generation/ala2/solvated/multiensemble/mean_variance_per_latent_dimension.npy
        var_data_file: data_generation/ala2/solvated/multiensemble/var_variance_per_latent_dimension.npy

inference_plotter_type: ALA2
inference_plotter_args:
    kde_sigma: 0.2
    kde_bin_x: 200
    kde_bin_y: 200
    minima_tolerance: 0.15
    n_minima_compare: 6
    n_BFGS_runs: 100
    labels_selection_map: # This is to extract phi and psi from all the dihedrals. The indices are based on the order of dihedrals in the datareader output.
        phi_2_cos: [dihedral_cos, 6]
        phi_2_sin: [dihedral_sin, 6]
        psi_2_cos: [dihedral_cos, 10]
        psi_2_sin: [dihedral_sin, 10]
#####################################################################
