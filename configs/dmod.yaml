debug: False
output_to_file: True
overwrite: False
outpath: ./dmods_v2
outfolder: ver
nexp: 1
description: "Dataset from 300K. 8-8"
verbose: INFO

datamodule_type: SEQUENCE
datamodule_args:
    datareader_type: "XTC_CHUNKS_CG"
    datareader_args:
        xtcfile: ./data_generation/ala2/solvated/300K/ala2_100ns/md.xtc
        tprfile: ./data_generation/ala2/solvated/300K/initialization/tpr_initial.tpr
        selection: "(resname ALA or resname ACE or resname NME) and not element H"
        cg_window: 4
        parallel: True
    dataset_type : "GRAPH"
    labeler_type : "DIHEDRAL"
    labeler_args:
        label_dihedrals:
            - phi_2
            - psi_2
    input_chunk_length: 8
    output_chunk_length: 8
    n_seq_per_sample : 128
    train_size : 128
    batch_size : 16
    validation_size : 32
    val_batch_size : 8
    test_size: 32
    test_batch_size: 8
    num_workers : 4
    norm_type : "minmax"

data_analyser_type: ALA2